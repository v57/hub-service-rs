[package]
name = "hub-service-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of hub-service: connect to a hub, host post/stream API endpoints, register apps, hub-pro auth (ed25519 keychain)."

[dependencies]
channel-rs = { path = "../../Channel/channel-rs/crates/channel-rs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
