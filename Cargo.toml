[package]
name = "hub-service-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of hub-service: connect to a hub, host post/stream API endpoints, register apps (lite: no auth, no crypto)."

[dependencies]
channel-rs = { path = "../channel-rs/crates/channel-rs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
